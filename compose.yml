services:
  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thevoid
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - proxiable
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  thevoid:
    container_name: thevoid
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - node:24-alpine
      args:
        - GIT_COMMIT=$GIT_COMMIT
        - DATABASE_URL=$DATABASE_URL
    secrets:
      - env_file
    env_file:
      - .env.deploy
    environment:
      - NODE_ENV=production
      - DATABASE_URL
      - POSTGRES_PASSWORD
      - GIT_COMMIT
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxiable
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # certbot:
  #   image: certbot/certbot:latest
  #   volumes:
  #     - type: bind
  #       source: /etc/letsencrypt/
  #       target: /etc/letsencrypt/
  #     - type: bind
  #       source: /var/www/certbot/
  #       target: /var/www/certbot/
volumes:
  pgdata:
    driver: local
  database:
    driver: local
  letsencrypt:
    driver: local
  certbot:
    driver: local

secrets:
  env_file:
    file: "./.env.deploy"

networks:
  proxiable:
    name: proxiable
